[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/work"
  to = "/index.html"
  status = 301

# Keep the archived pages private. The repo root is the publish directory, so
# without this rule /archive/dolldress.html would be public.
[[redirects]]
  from = "/archive/*"
  to = "/404.html"
  status = 404
  force = true
